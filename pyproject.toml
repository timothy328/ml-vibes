[project]
name = "ml-vibes"
version = "0.1.0"
description = "Simple California housing binary classification example."
requires-python = ">=3.10"
dependencies = [
    "certifi>=2023.7.22",
    "fastapi>=0.110",
    "numpy>=1.24",
    "pydantic>=2.0",
    "scikit-learn>=1.2",
    "uvicorn[standard]>=0.27",
    "xgboost>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]