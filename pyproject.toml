[project]
name = "ml-vibes"
version = "0.1.0"
description = "Simple California housing binary classification example."
requires-python = "==3.14.5"
dependencies = [
    "certifi>=2025.1.31",
    "fastapi>=0.120.0",
    "numpy>=2.3.0",
    "pydantic>=2.12.0",
    "scikit-learn>=1.2",
    "uvicorn[standard]>=0.27",
    "xgboost>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]